<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#cfeaf6">
<title>たわーばとる</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--sky:#cfeaf6;--ink:#3b4a54;--panel:#fffdf7;--line:#c6dde6;--p0:#ef8a6f;--p0d:#b9543a;--p1:#6b9fe0;--p1d:#2f62a8;--accent:#ffc86b;--accentd:#e3a53c;--muted:#7d8d96;--good:#7cbf6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);color:var(--ink)}
body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;font-weight:700;touch-action:none;user-select:none;-webkit-user-select:none}
button,input{font:inherit;color:inherit}
button{background:var(--panel);border:2.5px solid var(--line);border-radius:18px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.95)}
.hidden{display:none!important}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:9}
#celTap{position:fixed;inset:0;z-index:30}
body.cel #hud,body.cel #quit,body.cel #gSet,body.cel #side,body.cel #waitTx,body.cel #ctrl{visibility:hidden}
.layer{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 18px)}
.card{width:100%;max-width:440px;background:var(--panel);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.big{width:100%;max-width:440px;font-size:22px;font-weight:900;padding:15px 0;background:var(--accent);border-color:var(--accentd);color:#5a3b00}
.sub{width:100%;max-width:440px;font-size:17px;padding:12px 0}
.link{border:none;background:none;font-size:14px;color:var(--muted);text-decoration:underline;padding:6px}
input.tx{width:100%;font-size:20px;padding:12px 14px;border-radius:16px;border:2.5px solid var(--line);outline:none;background:#fff;min-width:0}
input.tx:focus{border-color:var(--p1)}
/* home */
#home{background:rgba(207,234,246,.82);justify-content:flex-start;gap:12px;overflow-y:auto;padding-top:calc(env(safe-area-inset-top) + 66px)}
#home h1{margin:0 0 4px;font-size:clamp(40px,12.5vw,54px);font-weight:900;letter-spacing:2px;text-align:center;line-height:1.05;color:var(--ink);flex:none}
#home .card{flex:none}
#homeSpace{flex:1 1 auto;min-height:6px}
#home h1 small{display:block;font-size:16px;font-weight:700;color:var(--muted);letter-spacing:3px;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:14px;padding:6px 11px;border-radius:999px;border-width:2px}
.src{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:14px;color:var(--muted)}
.src button{font-size:14px;padding:7px 6px;border-radius:999px;border-width:2px;white-space:nowrap}
.srcLbl{grid-column:1/-1;font-size:13px}
.src button[data-s=fr].on{background:#fff3d6;border-color:var(--accent);color:#8a5a00}
#topicBlock.frOnly #topic,#topicBlock.frOnly #chips{opacity:.35;pointer-events:none}
#topicBlock.frOnly #topic{background:#f4f1ea}
.src button.on{background:#e9f1fc;border-color:var(--p1);color:var(--p1d)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{font-size:15px;padding:8px 2px 9px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.seg button i{font-style:normal;font-size:22px;line-height:1.1}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.netrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.netrow button{font-size:16px;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;min-width:0}
.netrow button i{font-style:normal;font-size:22px;line-height:1.1}
#topic::placeholder,#myName::placeholder,#chatIn::placeholder,#rTopic::placeholder{color:#a9b6bd;font-weight:500}
#joinNo{text-align:center;letter-spacing:6px;font-size:24px}
#joinNo::placeholder{letter-spacing:0;font-size:16px;color:#a9b6bd;font-weight:500}
.foot{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center}
.portal{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:10px;padding:8px 14px;font-size:16px;text-decoration:none;color:var(--ink);background:var(--panel);border:2.5px solid var(--line);border-radius:14px}
/* loading / lobby */
#load,#lobby{background:rgba(207,234,246,.94);justify-content:center;gap:14px}
.ltx{font-size:20px;text-align:center;line-height:1.5}
.lnum{font-size:44px;font-weight:900}
.thumbs{display:grid;grid-template-columns:repeat(5,56px);gap:8px;min-height:56px}
.thumbs canvas{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:14px}
#roomNo{font-size:64px;font-weight:900;letter-spacing:10px;line-height:1}
/* hud */
#hud{position:fixed;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 10px) 10px 0;pointer-events:none;z-index:5}
#turn{font-size:19px;font-weight:900;padding:7px 18px;border-radius:999px;background:var(--panel);border:3px solid var(--ink);min-width:120px;text-align:center}
#tally{font-size:14px;display:flex;gap:8px;text-shadow:0 0 3px #fff,0 0 3px #fff}
#pName{font-size:14px;font-weight:800;color:var(--ink);background:rgba(255,253,247,.82);padding:3px 12px;border-radius:999px;max-width:86vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pName:empty{display:none}
#pName small{font-size:11px;font-weight:700;color:var(--muted);margin-left:6px}
body.cel #pName,body.result #pName{visibility:hidden}
#quit{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:10px;width:46px;height:46px;font-size:20px;padding:0;z-index:6}
#roomTag{position:fixed;top:calc(env(safe-area-inset-top) + 14px);right:10px;font-size:13px;padding:5px 10px;border-radius:999px;background:var(--panel);border:2px solid var(--line);z-index:6;display:flex;align-items:center;gap:5px}
#roomTag i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
#ctrl{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;justify-content:center;padding:0 14px calc(env(safe-area-inset-bottom) + 14px);z-index:6}
#ctrl button{height:72px;font-size:22px;font-weight:900;border-width:3px}
#drop{flex:1;max-width:340px;background:var(--accent);border-color:var(--accentd);color:#5a3b00}
#waitTx{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 34px);text-align:center;font-size:18px;z-index:6;text-shadow:0 0 4px #fff,0 0 4px #fff}
#side{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 98px);display:flex;flex-direction:column;gap:8px;z-index:21}
#side button{width:46px;height:46px;border-radius:50%;padding:0;font-size:21px}
/* chat + reactions */
#chatLog{position:fixed;left:12px;right:72px;bottom:calc(env(safe-area-inset-bottom) + 98px);font-size:14px;line-height:1.55;z-index:20;pointer-events:none;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
#chatLog div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rxBar{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 98px);display:flex;gap:6px;overflow-x:auto;z-index:21;padding:2px}
#rxBar button,.rx{font-size:15px;padding:7px 12px;border-radius:999px;border:2.5px solid var(--line);background:#fff;white-space:nowrap;flex:none}
#chatBar{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:6px;z-index:21}
#chatIn{flex:1;font-size:16px;padding:10px 12px;border-radius:14px;border:2.5px solid var(--line);background:rgba(255,255,255,.95);outline:none;min-width:0}
#chatBar button{width:52px;border-radius:14px;font-size:16px;padding:0}
#chatSend{background:var(--ink)!important;color:#fff;border-color:var(--ink)!important}
#rxLayer{position:fixed;inset:0;pointer-events:none;z-index:22;overflow:hidden}
.bub{position:absolute;font-size:20px;font-weight:900;padding:6px 14px;border-radius:999px;background:#fff;border:3px solid var(--line);white-space:nowrap;animation:fl 3.2s ease-out forwards}
.bub small{font-size:11px;color:var(--muted);margin-left:5px}
@keyframes fl{0%{transform:translateY(16px) scale(.6);opacity:0}12%{transform:translateY(0) scale(1.08);opacity:1}20%{transform:scale(1)}80%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
body:not(.play) #side,body:not(.play) #ctrl,body:not(.play) #waitTx,body:not(.play) #quit{display:none}
body:not(.social) #side,body:not(.social) #chatLog,body:not(.net) #roomTag{display:none}
body:not(.play):not(.result) #hud,body:not(.play):not(.result):not(.talk) #chatLog,body:not(.play):not(.result):not(.talk) #roomTag{display:none}
#rxBar,#chatBar{display:none}
body.play.rxOpen #rxBar{display:flex}
body.play.rxOpen #chatLog{bottom:calc(env(safe-area-inset-bottom) + 146px)}
body.play.chatOpen #chatBar{display:flex}
body.play.chatOpen #ctrl,body.play.chatOpen #waitTx{display:none}
body.result.social #rxBar{display:flex;bottom:calc(env(safe-area-inset-bottom) + 64px)}
body.result.social #chatBar{display:flex}
body.result #chatLog{bottom:calc(env(safe-area-inset-bottom) + 112px);color:#fff;text-shadow:0 0 3px #3b4a54,0 0 3px #3b4a54,0 0 3px #3b4a54}
/* result */
#res{background:rgba(59,74,84,.45);justify-content:center;z-index:10}
#pick,#waitL,#toss{background:rgba(207,234,246,.94);justify-content:center;gap:12px;overflow-y:auto}
#tossName{font-size:46px;font-weight:900;padding:10px 26px;border-radius:24px;background:var(--panel);border:4px solid var(--ink);min-width:200px;text-align:center}
.lenlbl{font-size:15px;color:var(--muted);margin-bottom:6px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg3 button{font-size:17px;padding:10px 0}
.seg3 button.on{background:var(--p0);color:#fff;border-color:var(--p0d)}
.lenNote{font-size:13px;color:var(--muted);margin-top:8px}
.mstat{font-size:14px;color:var(--muted)}
body.talk.social #rxBar{display:flex;bottom:calc(env(safe-area-inset-bottom) + 64px)}
body.talk.social #chatBar{display:flex}
body.talk.social #chatLog{display:block;bottom:calc(env(safe-area-inset-bottom) + 112px)}
body.talk.social .layer{padding-bottom:calc(env(safe-area-inset-bottom) + 150px)}
body.social #res{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top) + 74px)}
#res .card{align-items:center;text-align:center;gap:10px}
#resBig{font-size:27px;font-weight:900;line-height:1.2}
#resSub{font-size:16px;color:var(--muted)}
.tchips{display:flex;gap:6px;font-size:14px}
.tchips span{border-radius:999px;padding:4px 12px}
.want{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:14px}
.want div{border-radius:14px;padding:7px 4px;border:2px solid var(--line);color:var(--muted)}
.want div.on{border-color:#a8d79a;background:#eef8e9;color:#3f7a2f}
.want div.on.them{animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.05)}}
.prow{width:100%;display:flex;align-items:center;gap:6px}
.prow .mini{flex:1;display:flex;gap:4px;overflow:hidden}
.prow .mini canvas{width:30px;height:30px;object-fit:contain;background:#f3f6f8;border-radius:8px;flex:none}
.prow button{font-size:14px;padding:7px 10px;border-radius:12px;white-space:nowrap}
#cred{background:rgba(59,74,84,.55);justify-content:center;z-index:40}
#cred .card{max-height:80vh}
#credList{overflow-y:auto;font-size:13px;font-weight:500;line-height:1.5;display:flex;flex-direction:column;gap:8px}
#credList a{color:var(--p1d);word-break:break-all}
/* settings + changelog sheets (same layout as the other games) */
.topBtn{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:10px;width:46px;height:46px;padding:0;font-size:22px}
#gSet{position:fixed;top:calc(env(safe-area-inset-top) + 64px);left:10px;width:46px;height:46px;font-size:20px;padding:0;z-index:6}
body:not(.play) #gSet{display:none}
.ov{position:fixed;inset:0;background:rgba(59,74,84,.5);display:flex;align-items:flex-end;justify-content:center;z-index:45}
.sheet{width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:var(--panel);border-radius:26px 26px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column;gap:6px}
.sheet h2{margin:0 0 6px;text-align:center;font-size:21px;font-weight:900}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:2px solid #eef2f4;font-size:16px}
.srow small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.sg{display:flex;border:2.5px solid var(--line);border-radius:14px;overflow:hidden;flex:none}
.sg button{border:0;border-radius:0;padding:8px 12px;font-size:15px;background:#fff}
.sg button+button{border-left:2px solid var(--line)}
.sg button.on{background:var(--ink);color:#fff}
.rowBtn{display:flex;justify-content:space-between;align-items:center;border:0;border-bottom:2px solid #eef2f4;border-radius:0;background:none;padding:14px 2px;font-size:16px;text-align:left}
.rowBtn .rs{color:var(--muted);font-size:14px}
.newb{margin-left:8px;font-size:11px;background:var(--p0);color:#fff;border-radius:999px;padding:2px 8px;vertical-align:2px}
.dbtn{font-size:14px;padding:7px 14px;border-color:#efb3a6;color:#b9543a;border-radius:12px}
.chip{display:inline-block;padding:3px 12px;border-radius:12px;border:2px solid #d9d2c3;font-size:14px;font-weight:700;color:var(--muted)}
.chg{max-height:62vh;overflow:auto;text-align:left}
.chg h3{font-size:16px;margin:12px 0 4px;color:var(--accentd)}
.chg ul{margin:0;padding-left:20px;font-size:15px;font-weight:500;line-height:1.7}
.chg details{margin:0 0 4px}
.chg summary{font-size:15px;font-weight:700;color:var(--muted);padding:8px 0;cursor:pointer}
#ver.new{color:var(--p0d);text-decoration:none;font-weight:900}
#altB{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 118px);transform:translate(-50%,-10px) scale(.6);background:rgba(255,253,247,.95);color:var(--ink);border:3px solid var(--accent);padding:8px 18px;border-radius:999px;font-size:19px;font-weight:900;white-space:nowrap;opacity:0;pointer-events:none;z-index:40;box-shadow:0 4px 0 rgba(59,74,84,.12)}
#altB.on{animation:altPop 2.6s ease forwards}
@keyframes altPop{0%{opacity:0;transform:translate(-50%,-10px) scale(.6)}12%{opacity:1;transform:translate(-50%,0) scale(1.08)}20%{transform:translate(-50%,0) scale(1)}80%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-8px) scale(.96)}}
body.cel #altB{display:none}
.cs{max-height:86vh;overflow:auto;font-size:14px;line-height:1.6}
.cs h2{font-size:21px;margin:0 0 8px}.cs h3{font-size:15px;margin:12px 0 2px}.cs ul{margin:0;padding-left:20px}.cs p{margin:0}
#coach{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);width:min(92vw,380px);background:rgba(255,253,247,.97);border:3px solid var(--accent);border-radius:20px;padding:12px 14px 10px;z-index:30;box-shadow:0 5px 0 rgba(59,74,84,.12);display:none}
body.tut.play #coach{display:block}
body.tut.play.cel #coach,body.tut.play.result #coach{display:none}
#coachTx{font-size:19px;font-weight:900;line-height:1.45;text-align:center;color:var(--ink)}
#coachTx small{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-top:2px}
#coachTx.pop{animation:cpop .35s ease}
@keyframes cpop{0%{transform:scale(.9);opacity:.3}100%{transform:scale(1);opacity:1}}
#coachRow{display:flex;align-items:center;gap:8px;margin-top:8px}
#coachDots{flex:1;display:flex;gap:5px}
#coachDots i{width:9px;height:9px;border-radius:50%;background:#d9d2c3}
#coachDots i.on{background:var(--accent)}
#coachRow button{border:0;background:none;font-size:14px;font-weight:800;color:var(--muted);padding:6px 4px}
#coachNext{color:var(--accentd)!important;font-size:16px!important}
body.tut #hud,body.tut #gSet{visibility:hidden}
body.tut #altB{top:calc(env(safe-area-inset-top) + 200px)}
body.tutDrop #drop{animation:dpulse 1s ease infinite}
@keyframes dpulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,190,80,.7)}50%{transform:scale(1.05);box-shadow:0 0 0 12px rgba(255,190,80,0)}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 96px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:15px;max-width:90vw;text-align:center;transition:opacity .4s;pointer-events:none;z-index:50}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<canvas id="fx"></canvas>
<div id="celTap" class="hidden"></div>

<div id="hud"><div id="turn">あかの番</div><div id="tally"></div><div id="pName"></div></div>
<button id="quit" aria-label="やめる">✕</button>
<button id="gSet" aria-label="設定">⚙</button>
<div id="roomTag"><i></i><span id="roomTagNo">部屋</span></div>
<div id="ctrl">
  <button id="drop" aria-label="おとす">おとす ▼</button>
</div>
<div id="waitTx"></div>
<div id="side"><button id="rxBtn" aria-label="リアクション">😊</button><button id="chatBtn" aria-label="チャット">💬</button></div>
<div id="chatLog"></div>
<div id="rxBar"></div>
<div id="chatBar"><input id="chatIn" type="text" maxlength="40" placeholder="メッセージ" enterkeyhint="send" autocomplete="off"><button id="chatSend" aria-label="おくる">➤</button><button id="chatClose" aria-label="とじる">✕</button></div>
<div id="rxLayer"></div>

<div id="home" class="layer">
  <a class="portal hidden" id="portal" href="/">‹ 一覧</a>
  <button class="topBtn" id="setBtn" aria-label="設定">⚙</button>
  <h1>たわーばとる<small>なんでも積みあげ</small></h1>
  <div class="card">
    <div class="seg" id="mode"><button data-m="solo"><i>👤</i>ひとり</button><button data-m="cpu"><i>🤖</i>CPU</button><button data-m="net"><i>🌐</i>ネット対戦</button></div>
    <div id="topicHome"><div id="topicBlock" style="display:flex;flex-direction:column;gap:12px">
      <input id="topic" class="tx" type="text" placeholder="お題を入れてね" enterkeyhint="go" autocomplete="off">
      <div class="chips" id="chips"></div>
      <div class="src" id="srcSeg"><span class="srcLbl">パーツのもと（いくつでも えらべるよ）</span><button data-s="fr">🙂 なかまたち</button><button data-s="ira">いらすとや</button><button data-s="emo">えもじ</button><button data-s="wiki">ウィキメディア</button></div>
    </div></div>
    <div id="lenBox" class="hidden"><div class="lenlbl">何勝先取？</div><div class="seg3" id="lenSeg"><button data-n="1">1勝</button><button data-n="3">3勝</button><button data-n="5">5勝</button></div><div class="lenNote">先手はランダム。お題は先手から交代できめるよ</div></div>
    <div id="netBox" class="hidden" style="display:flex;flex-direction:column;gap:8px">
      <label for="myName" class="lenlbl" style="margin:0">あなたの名前<span style="font-weight:500">（相手の画面に出るよ）</span></label>
      <input id="myName" class="tx" type="text" maxlength="8" placeholder="例）たかし" autocomplete="off" style="font-size:17px;padding:10px 12px">
      <div class="netrow"><button id="mkRoom"><i>🏠</i>部屋をつくる</button><button id="joinBtn"><i>🚪</i>部屋に入る</button></div>
      <div id="joinBox" class="hidden" style="display:flex;gap:8px"><input id="joinNo" class="tx" type="tel" inputmode="numeric" maxlength="4" placeholder="ばんごう4けた" autocomplete="off"><button id="joinGo" style="width:84px;font-size:17px">入る</button></div>
    </div>
  </div>
  <div id="homeSpace"></div>

   - 送る内容が増えたら CS_VER を上げる。前の版で「同意」していた人には、新しい内容で1回だけ聞き直す

    ['KROPKI', '問題をクリアしたときの記録（サイズ・難しさ・問題番号・タイム・チェックの回数）'],
    ['LAPIS', 'ゲームが終わったときの記録（点数・いちばん大きい星・手数・最大連鎖・選んだ加護・KEEPとワームホールを使った回数・プレイ時間）'],

    ['ゲームポータル', 'どのゲームを開いたか']
